
services:
  db:
    image: postgres:16
    container_name: datapulse-db
    environment:
      POSTGRES_DB: datapulse
      POSTGRES_USER: datapulse_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datapulse_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapulse_user -d datapulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: datapulse-api
    environment:
      DATABASE_URL: postgresql+psycopg://datapulse_user:${POSTGRES_PASSWORD}@db:5432/datapulse
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  datapulse_data:
