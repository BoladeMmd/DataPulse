
services:
  db:
    image: postgres:16
    container_name: datapulse-db
    environment:
      POSTGRES_DB: datapulse
      POSTGRES_USER: datapulse_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datapulse_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapulse_user -d datapulse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    container_name: datapulse-api
    environment:
      DATABASE_URL: postgresql+psycopg://datapulse_user:${POSTGRES_PASSWORD}@db:5432/datapulse
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: datapulse-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: datapulse-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  datapulse_data:
  prometheus_data:
  grafana_data:
